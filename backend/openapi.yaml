openapi: 3.1.0
info:
  title: finance-ids API
  version: 1.0.0
  description: |
    Internal API for the Indismart financial dashboard.

    **How to call authenticated endpoints:** run `POST /api/auth/login`, copy
    the `token` from the response, click **Authorize** (top right), and paste it.

    All money amounts are integer Rupiah. All dates are `YYYY-MM-DD`.
servers:
  - url: /
    description: Same host as this page
  - url: http://localhost:4000
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Is the API up? No login needed
  - name: Auth
    description: Log in to get a token
  - name: Me
    description: The logged-in user
  - name: Users
    description: Account management (superadmin only)
  - name: Notes
    description: Dashboard notes
  - name: Dashboard
    description: The Director's one-page health view
  - name: Invoices
    description: Money In — invoice documents (Draft ▸ Posted ▸ Voided)
  - name: Expenses
    description: Money Out — expense documents (Draft ▸ Posted ▸ Cancelled/Voided)
  - name: Projects
    description: Projects, their health, and budgets
  - name: Clients
    description: Customer picker (read-only)
  - name: Partners
    description: Customers, vendors, employees, lenders
  - name: Budgets
    description: Money Out — spending vs plan
  - name: Trends
    description: Revenue vs targets and breakdowns
  - name: Accounting
    description: Ledger reports, manual entries, loans, fiscal periods
  - name: Attachments
    description: File uploads attached to documents

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check the API is up
      security: []
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and get a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Paste this into Authorize" }
                  expiresAt: { type: integer, description: Unix seconds }
                  user: { $ref: "#/components/schemas/AuthUser" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Account deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get the logged-in user
      description: "Permission: any logged-in role."
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Everything the Dashboard page shows, in one call
      description: |
        Permission: any logged-in role.

        Headline numbers (cash, revenue this month, operating profit), plain-language
        attention items (worst first), unpaid invoices (largest first), and project
        stats. Draft and voided invoices are excluded. "This month" is based on the
        server's reference date (`APP_TODAY` if set).
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List every invoice with its derived status, plus totals
      description: |
        Permission: any logged-in role.

        Returns all invoices (every document status). `summary` only counts posted,
        non-voided, unpaid invoices as money owed.
      responses:
        "200":
          description: Invoices and summary
          content:
            application/json:
              schema:
                type: object
                required: [asOf, invoices, summary]
                properties:
                  asOf: { type: string }
                  invoices:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceListItem" }
                  summary:
                    type: object
                    required: [totalUnpaid, totalOverdue, totalAwaiting, averageDaysToPay]
                    properties:
                      totalUnpaid: { $ref: "#/components/schemas/Money" }
                      totalOverdue: { $ref: "#/components/schemas/Money" }
                      totalAwaiting: { $ref: "#/components/schemas/Money" }
                      averageDaysToPay: { type: integer, description: "Average days clients take to pay us (0 if nothing paid yet)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Create a draft invoice
      description: |
        Permission: `invoices.write` (superadmin, admin).

        Creates a **draft** — no ledger effect until `POST /api/invoices/{id}/post`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceNumber, projectId, amount, issuedDate, dueDate]
              properties:
                invoiceNumber: { type: string, example: INV/2026/0042 }
                projectId: { $ref: "#/components/schemas/Id" }
                amount: { $ref: "#/components/schemas/Money" }
                issuedDate: { $ref: "#/components/schemas/IsoDate" }
                dueDate:
                  allOf: [{ $ref: "#/components/schemas/IsoDate" }]
                  description: Must be on or after issuedDate
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get one invoice document
      description: "Permission: any logged-in role."
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Invoices]
      operationId: updateInvoice
      summary: Edit a draft invoice
      description: |
        Permission: `invoices.write` (superadmin, admin).

        Only drafts can be edited — a posted invoice returns 409.
        `amount`, `issuedDate`, `dueDate` are always required; `invoiceNumber` and `projectId` are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, issuedDate, dueDate]
              properties:
                invoiceNumber: { type: string }
                projectId: { $ref: "#/components/schemas/Id" }
                amount: { $ref: "#/components/schemas/Money" }
                issuedDate: { $ref: "#/components/schemas/IsoDate" }
                dueDate: { $ref: "#/components/schemas/IsoDate" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/invoices/{id}/post:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Invoices]
      operationId: postInvoice
      summary: Post a draft invoice to the ledger
      description: |
        Permission: `invoices.write` (superadmin, admin).

        Creates the journal entry (debit receivables, credit revenue). From now on the
        invoice counts toward revenue and money owed, and can no longer be edited.
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/invoices/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Invoices]
      operationId: cancelDraftInvoice
      summary: Cancel a draft invoice
      description: |
        Permission: `invoices.write` (superadmin, admin).

        For drafts only (no ledger entry exists). To undo a **posted** invoice use `PATCH /api/invoices/{id}/void`.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/invoices/{id}/payment:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Invoices]
      operationId: recordInvoicePayment
      summary: Record money received against a posted invoice
      description: |
        Permission: `invoices.write` (superadmin, admin).

        Can be called several times for partial payments. Rejected (400) if the invoice
        isn't posted, is voided, is already fully paid, or the amount exceeds what's outstanding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountReceived, receivedDate]
              properties:
                amountReceived: { $ref: "#/components/schemas/Money" }
                receivedDate: { $ref: "#/components/schemas/IsoDate" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/invoices/{id}/void:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Invoices]
      operationId: voidInvoice
      summary: Void a posted invoice
      description: |
        Permission: `invoices.write` (superadmin, admin).

        Reverses the ledger entry. Shown as "Cancel invoice" in the UI and "Voided" as a status.
        Rejected (400) if the invoice isn't posted, is already voided, or has any payment recorded.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/health/db:
    get:
      tags: [Health]
      operationId: getDbHealth
      summary: Check the database connection
      security: []
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  clients: { type: integer, description: Number of client rows }

  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List all accounts
      description: "Permission: `users.manage` (superadmin)."
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create an account
      description: |
        Permission: `users.manage` (superadmin).

        No invite email — the superadmin sets a temporary password and shares it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                fullName: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/{id}/role:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Users]
      operationId: updateUserRole
      summary: Change an account's role
      description: "Permission: `users.manage` (superadmin). Takes effect within ~30s (profile cache)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/{id}/active:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Users]
      operationId: updateUserActive
      summary: Activate or deactivate an account
      description: "Permission: `users.manage` (superadmin). You can't deactivate your own account."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notes:
    get:
      tags: [Notes]
      operationId: listNotes
      summary: List Dashboard notes, newest first
      description: "Permission: any logged-in role."
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes:
                    type: array
                    items:
                      type: object
                      required: [id, body, authorName, createdAt]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
                        body: { type: string }
                        authorName: { type: string }
                        createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Notes]
      operationId: createNote
      summary: Add a Dashboard note
      description: "Permission: `notes.write` (superadmin, admin, director)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/expenses:
    get:
      tags: [Expenses]
      operationId: listExpenses
      summary: List expense documents (paginated, newest first)
      description: "Permission: `accounting.reports.read` (all roles)."
      parameters:
        - { name: from, in: query, schema: { $ref: "#/components/schemas/IsoDate" }, description: "spentOn on or after" }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/IsoDate" }, description: "spentOn on or before" }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/ExpenseCategory" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DocumentStatus" } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of expenses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ExpenseDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Expenses]
      operationId: createExpense
      summary: Create a draft expense
      description: |
        Permission: `spending.write` (superadmin, admin).

        Creates a **draft** (no ledger effect until posted). Two kinds:
        - **Cash expense** — no `dueDate`; optionally `paidFromAccountId` (which bank/cash account paid it).
        - **Vendor bill** — `dueDate` set; `partnerId` (the vendor) is then required, and `paidFromAccountId` is not allowed.

        `projectId` is required when `category` is `project_costs`, and not allowed otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ExpenseInput"
                - required: [category, description, amount, spentOn]
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/expenses/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Expenses]
      operationId: getExpense
      summary: Get one expense document
      description: "Permission: `accounting.reports.read` (all roles)."
      responses:
        "200":
          description: The expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Expenses]
      operationId: updateExpense
      summary: Edit a draft expense
      description: |
        Permission: `spending.write` (superadmin, admin).

        Send only the fields to change (same rules as create). Only drafts can be edited — a posted expense returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/expenses/{id}/post:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Expenses]
      operationId: postExpense
      summary: Post a draft expense to the ledger
      description: |
        Permission: `spending.write` (superadmin, admin).

        Assigns the document number (`EXP/YYYY/NNNNN`) and creates the journal entry.
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                type: object
                required: [id, documentNumber]
                properties:
                  id: { $ref: "#/components/schemas/Id" }
                  documentNumber: { type: string, example: EXP/2026/00012 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/expenses/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Expenses]
      operationId: cancelDraftExpense
      summary: Cancel a draft expense
      description: |
        Permission: `spending.write` (superadmin, admin).

        Drafts only. To undo a **posted** expense use `PATCH /api/expenses/{id}/void`.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/expenses/{id}/void:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Expenses]
      operationId: voidExpense
      summary: Void a posted expense
      description: |
        Permission: `spending.write` (superadmin, admin).

        Reverses the ledger entry. Blocked (400) if any payment has been allocated to it.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attachments/upload-url:
    post:
      tags: [Attachments]
      operationId: createAttachmentUploadUrl
      summary: "Step 1 of upload: get a signed upload URL"
      description: |
        Permission: `spending.write` (superadmin, admin).

        Upload flow:
        1. Call this to get `signedUrl` + `path`.
        2. `PUT` the file bytes straight to `signedUrl` (Supabase Storage — not this API).
        3. Call `POST /api/attachments` with `storagePath = path` to record it.

        Allowed types: PDF, PNG, JPEG, WebP. Max 10 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityType, entityId, fileName, mimeType, sizeBytes]
              properties:
                entityType: { $ref: "#/components/schemas/AttachmentEntityType" }
                entityId: { $ref: "#/components/schemas/Id" }
                fileName: { type: string, example: nota-januari.pdf }
                mimeType: { $ref: "#/components/schemas/AttachmentMimeType" }
                sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                type: object
                required: [path, token, signedUrl]
                properties:
                  path: { type: string, description: "Pass back as storagePath in step 3" }
                  token: { type: string }
                  signedUrl: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attachments:
    get:
      tags: [Attachments]
      operationId: listAttachments
      summary: List a document's attachments
      description: "Permission: any logged-in role. Each `viewUrl` expires after 60 seconds."
      parameters:
        - { name: entityType, in: query, required: true, schema: { $ref: "#/components/schemas/AttachmentEntityType" } }
        - { name: entityId, in: query, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Attachments, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments:
                    type: array
                    items:
                      type: object
                      required: [id, fileName, mimeType, sizeBytes, createdAt, viewUrl]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
                        fileName: { type: string }
                        mimeType: { $ref: "#/components/schemas/AttachmentMimeType" }
                        sizeBytes: { type: integer }
                        createdAt: { type: string, format: date-time }
                        viewUrl: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Attachments]
      operationId: createAttachment
      summary: "Step 3 of upload: record the uploaded file"
      description: |
        Permission: `spending.write` (superadmin, admin).

        Call after the `PUT` to the signed URL succeeded. `storagePath` must start with `{entityType}/{entityId}/`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityType, entityId, storagePath, fileName, mimeType, sizeBytes]
              properties:
                entityType: { $ref: "#/components/schemas/AttachmentEntityType" }
                entityId: { $ref: "#/components/schemas/Id" }
                storagePath: { type: string }
                fileName: { type: string }
                mimeType: { $ref: "#/components/schemas/AttachmentMimeType" }
                sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: Delete an attachment (file and record)
      description: "Permission: `spending.write` (superadmin, admin)."
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects with health, plus summary stats
      description: |
        Permission: any logged-in role.

        Sorted worst first: over budget, then close to billing, then on schedule.
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [projects, stats]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  stats: { $ref: "#/components/schemas/ProjectStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: |
        Permission: `projects.write` (superadmin, admin).

        Give **exactly one** of `clientId` (existing client) or `newClient` (created in the same call).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, productLine, contractValue]
              properties:
                clientId: { $ref: "#/components/schemas/Id" }
                newClient:
                  type: object
                  required: [name, clientType]
                  properties:
                    name: { type: string }
                    clientType: { $ref: "#/components/schemas/ClientType" }
                name: { type: string }
                productLine: { $ref: "#/components/schemas/ProductLine" }
                contractValue: { $ref: "#/components/schemas/Money" }
                budget:
                  type: [integer, "null"]
                  minimum: 0
                  description: Optional spending budget (Rupiah)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Edit a project's name, product line, and contract value
      description: |
        Permission: `projects.write` (superadmin, admin).

        The client can't be changed after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, productLine, contractValue]
              properties:
                name: { type: string }
                productLine: { $ref: "#/components/schemas/ProductLine" }
                contractValue: { $ref: "#/components/schemas/Money" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        Permission: `projects.write` (superadmin, admin).

        Permanent. Refused (400) if the project has any invoices or spending recorded.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{id}/flag:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Projects]
      operationId: flagProject
      summary: Flag or unflag a project for attention
      description: "Permission: `projects.flag` (superadmin, admin, director)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isFlagged]
              properties:
                isFlagged: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/projects/{id}/budget:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Projects]
      operationId: updateProjectBudget
      summary: Set a project's spending budget
      description: "Permission: `budgets.edit` (superadmin, admin, director)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget]
              properties:
                budget: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: List clients (customers) for pickers
      description: "Permission: any logged-in role."
      responses:
        "200":
          description: Clients, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items:
                      type: object
                      required: [id, name, clientType]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
                        name: { type: string }
                        clientType: { $ref: "#/components/schemas/ClientType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/partners:
    get:
      tags: [Partners]
      operationId: listPartners
      summary: List partners, optionally filtered by role
      description: "Permission: any logged-in role."
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [customer, vendor, employee, lender] }
      responses:
        "200":
          description: Partners, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [partners]
                properties:
                  partners:
                    type: array
                    items: { $ref: "#/components/schemas/Partner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Partners]
      operationId: createPartner
      summary: Create a partner (customer, vendor, employee, and/or lender)
      description: |
        Permission: `accounting.manual-entry` (superadmin, admin).

        At least one of the `is*` flags must be true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                clientType: { oneOf: [{ $ref: "#/components/schemas/ClientType" }, { type: "null" }] }
                isCustomer: { type: boolean }
                isVendor: { type: boolean }
                isEmployee: { type: boolean }
                isLender: { type: boolean }
                taxId: { type: string, description: NPWP }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/budgets:
    get:
      tags: [Budgets]
      operationId: getBudgets
      summary: Spending vs plan for one month, or all time
      description: |
        Permission: any logged-in role.

        - **Month scope** (default = current month): category plans vs that month's spending,
          plus per-project spending that month (no project budget health — budgets cover whole projects).
        - **All time** (`scope=all`): whole-project budgets vs cumulative spending; categories show spend only.

        All "spent" figures come from the ledger. Never add category and project budgets together —
        project costs appear in both.
      parameters:
        - name: scope
          in: query
          description: '"all", or a month start like 2026-06-01. Omit for the current month.'
          schema: { type: string, example: "2026-06-01" }
      responses:
        "200":
          description: Budget view
          content:
            application/json:
              schema:
                type: object
                required: [scope, availableMonths, categoryBudgets, projectBudgets, totals, projectNote, budgetInsights]
                properties:
                  scope:
                    type: object
                    required: [kind, period, label, isCurrent]
                    properties:
                      kind: { type: string, enum: [month, all] }
                      period: { type: [string, "null"], description: "YYYY-MM-01, null for all time" }
                      label: { type: string, example: June 2026 }
                      isCurrent: { type: boolean }
                  availableMonths:
                    type: array
                    description: Other months with spending or a plan (newest first), excluding the current month
                    items:
                      type: object
                      required: [period, label]
                      properties:
                        period: { type: string, example: "2026-05-01" }
                        label: { type: string, example: May 2026 }
                  categoryBudgets:
                    type: array
                    items: { $ref: "#/components/schemas/BudgetItem" }
                  projectBudgets:
                    type: array
                    items: { $ref: "#/components/schemas/BudgetItem" }
                  totals:
                    type: object
                    required: [budget, spent, remaining, pctUsed]
                    properties:
                      budget: { $ref: "#/components/schemas/Money" }
                      spent: { $ref: "#/components/schemas/Money" }
                      remaining: { type: integer }
                      pctUsed: { type: integer }
                  projectNote: { type: string, description: Plain-language summary for the projects section }
                  budgetInsights:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/budgets/categories/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ExpenseCategory" }
    patch:
      tags: [Budgets]
      operationId: updateCategoryBudget
      summary: Set this month's planned spending for a category
      description: "Permission: `budgets.edit` (superadmin, admin, director). Always applies to the current month."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plannedAmount]
              properties:
                plannedAmount: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/trends:
    get:
      tags: [Trends]
      operationId: getTrends
      summary: Revenue this year vs targets, and revenue breakdowns
      description: |
        Permission: any logged-in role.

        Revenue = posted, non-voided invoices by issue month. `monthlyRevenue` only includes
        months of the current year that have a target set. The product-line and client-type
        breakdowns cover all time.
      responses:
        "200":
          description: Revenue trends
          content:
            application/json:
              schema:
                type: object
                required: [monthlyRevenue, revenueByProductLine, revenueByClientType, revenueThisYear, yearTargetPct, governmentSharePct, topProductLine, currentPeriod, currentTarget]
                properties:
                  monthlyRevenue:
                    type: array
                    items:
                      type: object
                      required: [month, revenue, target]
                      properties:
                        month: { type: string, example: Jan }
                        revenue: { $ref: "#/components/schemas/Money" }
                        target: { $ref: "#/components/schemas/Money" }
                  revenueByProductLine:
                    type: array
                    items:
                      type: object
                      required: [productLine, amount]
                      properties:
                        productLine: { $ref: "#/components/schemas/ProductLine" }
                        amount: { $ref: "#/components/schemas/Money" }
                  revenueByClientType:
                    type: array
                    items:
                      type: object
                      required: [type, amount]
                      properties:
                        type: { type: string, enum: [Government (B2G), Private (B2B)] }
                        amount: { $ref: "#/components/schemas/Money" }
                  revenueThisYear: { $ref: "#/components/schemas/Money" }
                  yearTargetPct: { type: integer }
                  governmentSharePct: { type: integer }
                  topProductLine: { type: string }
                  currentPeriod: { type: string, example: "2026-09-01" }
                  currentTarget: { $ref: "#/components/schemas/Money" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/trends/targets/{period}:
    parameters:
      - name: period
        in: path
        required: true
        description: Month start, YYYY-MM-01
        schema: { type: string, pattern: '^\d{4}-\d{2}-01$', example: "2026-09-01" }
    patch:
      tags: [Trends]
      operationId: updateRevenueTarget
      summary: Set the revenue target for a month
      description: "Permission: `targets.edit` (superadmin, admin, director)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetAmount]
              properties:
                targetAmount: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/accounts:
    get:
      tags: [Accounting]
      operationId: listAccounts
      summary: Chart of accounts
      description: "Permission: `accounting.reports.read` (all roles)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/trial-balance:
    get:
      tags: [Accounting]
      operationId: getTrialBalance
      summary: Trial balance (debit/credit totals per account)
      description: |
        Permission: `accounting.reports.read` (all roles).

        `balance` = debit − credit, so liability/equity/revenue accounts read negative.
        The frontend's balance sheet is derived from this one call.
      parameters:
        - { name: asOf, in: query, description: "Only count entries on or before this date. Omit for all time.", schema: { $ref: "#/components/schemas/IsoDate" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [asOf, accounts]
                properties:
                  asOf: { type: [string, "null"] }
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/TrialBalanceRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/summary:
    get:
      tags: [Accounting]
      operationId: getFinancialSummary
      summary: Headline ledger totals (assets, liabilities, cash, profit…)
      description: |
        Permission: `accounting.reports.read` (all roles).

        Balances since the start of the books (up to `asOf`). All values use the usual positive sign.
      parameters:
        - { name: asOf, in: query, description: "Only count entries on or before this date. Omit for all time.", schema: { $ref: "#/components/schemas/IsoDate" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/general-ledger:
    get:
      tags: [Accounting]
      operationId: getGeneralLedger
      summary: Posted journal lines, filterable (not paginated)
      description: "Permission: `accounting.reports.read` (all roles). Use filters — this returns every matching line."
      parameters:
        - { name: accountId, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - name: accountSubtype
          in: query
          description: Repeatable, e.g. `?accountSubtype=bank&accountSubtype=cash` for all cash accounts
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AccountSubtype" }
        - { name: projectId, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: partnerId, in: query, schema: { $ref: "#/components/schemas/Id" } }
        - { name: from, in: query, description: "Start date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: to, in: query, description: "End date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/GeneralLedgerLine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/entries:
    get:
      tags: [Accounting]
      operationId: listJournalEntries
      summary: Journal entries, newest first (paginated, without lines)
      description: "Permission: `accounting.reports.read` (all roles)."
      parameters:
        - { name: from, in: query, description: "Start date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: to, in: query, description: "End date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: journalCode, in: query, description: "SAL, PUR, BNK1 (BCA), BNK2 (Mandiri), CSH, PAY, GEN", schema: { type: string } }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DocumentStatus" }
          description: Defaults to posted
        - $ref: "#/components/parameters/Page"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/JournalEntryRow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Accounting]
      operationId: createJournalEntry
      summary: Create a manual journal entry
      description: |
        Permission: `accounting.manual-entry` (superadmin, admin).

        Needs at least 2 lines; each line has exactly one of `debit`/`credit` > 0, and total debits
        must equal total credits. `status: "draft"` saves it editable and out of every report;
        omitted or `"posted"` posts immediately. Posting into a closed fiscal period is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journalCode, accountingDate, description, lines]
              properties:
                journalCode: { type: string, example: GEN }
                accountingDate: { $ref: "#/components/schemas/IsoDate" }
                description: { type: string }
                reference: { type: [string, "null"] }
                status: { type: string, enum: [draft, posted], default: posted }
                lines:
                  type: array
                  minItems: 2
                  items: { $ref: "#/components/schemas/ManualEntryLine" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostedEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/entries/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Accounting]
      operationId: getJournalEntry
      summary: One journal entry with its lines
      description: "Permission: `accounting.reports.read` (all roles)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Accounting]
      operationId: updateJournalEntry
      summary: Edit a draft journal entry
      description: |
        Permission: `accounting.manual-entry` (superadmin, admin).

        Send only what changes; `lines`, if sent, replaces all lines. Posted entries can't be edited (409) — cancel them instead, which posts a reversal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                journalCode: { type: string }
                accountingDate: { $ref: "#/components/schemas/IsoDate" }
                description: { type: string }
                reference: { type: [string, "null"] }
                lines:
                  type: array
                  minItems: 2
                  items: { $ref: "#/components/schemas/ManualEntryLine" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/accounting/entries/{id}/post:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Accounting]
      operationId: postJournalEntry
      summary: Post a draft journal entry
      description: |
        Permission: `accounting.manual-entry` (superadmin, admin).

        The database checks it balances and that the fiscal period is open.
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostedEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/accounting/entries/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Accounting]
      operationId: cancelJournalEntry
      summary: Cancel a draft, or reverse a posted entry
      description: |
        Permission: `accounting.manual-entry` (superadmin, admin).

        - Draft → cancelled in place; response is `{ ok: true }`.
        - Posted → a reversal entry dated today is posted; response includes `reversal`.
        - Already cancelled → 409.
      responses:
        "200":
          description: Cancelled or reversed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
                  reversal: { $ref: "#/components/schemas/PostedEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/accounting/projects/{id}/profitability:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Accounting]
      operationId: getProjectProfitability
      summary: One project's revenue, cost, and profit from the ledger
      description: "Permission: `accounting.reports.read` (all roles)."
      parameters:
        - { name: asOf, in: query, description: "Only count entries on or before this date. Omit for all time.", schema: { $ref: "#/components/schemas/IsoDate" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [revenue, cost, profit]
                properties:
                  revenue: { $ref: "#/components/schemas/Money" }
                  cost: { $ref: "#/components/schemas/Money" }
                  profit: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/project-profitability:
    get:
      tags: [Accounting]
      operationId: listProjectProfitability
      summary: Project profitability leaderboard
      description: "Permission: `accounting.reports.read` (all roles)."
      parameters:
        - { name: asOf, in: query, description: "Only count entries on or before this date. Omit for all time.", schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [asOf, projects]
                properties:
                  asOf: { type: [string, "null"] }
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectProfitabilityRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/ar-aging:
    get:
      tags: [Accounting]
      operationId: getArAging
      summary: Unpaid invoices — who owes us and for how long
      description: "Permission: `accounting.reports.read` (all roles). Open posted invoices bucketed by days past due, overall and per customer."
      parameters:
        - { name: asOf, in: query, description: "Defaults to today", schema: { $ref: "#/components/schemas/IsoDate" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgingResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/ap-aging:
    get:
      tags: [Accounting]
      operationId: getApAging
      summary: Unpaid vendor bills — who we owe and for how long
      description: "Permission: `accounting.reports.read` (all roles). Open vendor bills bucketed by days past due, overall and per vendor."
      parameters:
        - { name: asOf, in: query, description: "Defaults to today", schema: { $ref: "#/components/schemas/IsoDate" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgingResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/debt:
    get:
      tags: [Accounting]
      operationId: listDebt
      summary: Loans with outstanding principal and interest paid
      description: "Permission: `accounting.reports.read` (all roles)."
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LoanStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [loans]
                properties:
                  loans:
                    type: array
                    items: { $ref: "#/components/schemas/DebtOutstandingRow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/pl-monthly:
    get:
      tags: [Accounting]
      operationId: getMonthlyPL
      summary: Revenue, expenses and profit per month
      description: "Permission: `accounting.reports.read` (all roles). Months with no activity are returned as zeros."
      parameters:
        - { name: from, in: query, required: true, description: "Start date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: to, in: query, required: true, description: "End date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [from, to, months]
                properties:
                  from: { $ref: "#/components/schemas/IsoDate" }
                  to: { $ref: "#/components/schemas/IsoDate" }
                  months:
                    type: array
                    items:
                      type: object
                      required: [month, revenue, expenses, netIncome]
                      properties:
                        month: { type: string, example: "2026-06-01" }
                        revenue: { $ref: "#/components/schemas/Money" }
                        expenses: { $ref: "#/components/schemas/Money" }
                        netIncome: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/income-statement:
    get:
      tags: [Accounting]
      operationId: getIncomeStatement
      summary: Income statement (profit & loss) for a period, per account
      description: "Permission: `accounting.reports.read` (all roles)."
      parameters:
        - { name: from, in: query, required: true, description: "Start date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: to, in: query, required: true, description: "End date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeStatement"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/cash-flow:
    get:
      tags: [Accounting]
      operationId: getCashFlow
      summary: Cash in and out over a period, bucketed
      description: "Permission: `accounting.reports.read` (all roles)."
      parameters:
        - { name: from, in: query, required: true, description: "Start date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: to, in: query, required: true, description: "End date (inclusive)", schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: granularity, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashFlow"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/vendor-bills/{id}/payment:
    parameters:
      - name: id
        in: path
        required: true
        description: The expense id of the vendor bill
        schema: { $ref: "#/components/schemas/Id" }
    post:
      tags: [Accounting]
      operationId: recordVendorBillPayment
      summary: Record a payment against a vendor bill
      description: |
        Permission: `accounting.post` (superadmin, admin).

        Partial payments allowed; overpayment is rejected (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountPaid, paymentDate]
              properties:
                amountPaid: { $ref: "#/components/schemas/Money" }
                paymentDate: { $ref: "#/components/schemas/IsoDate" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/loans:
    post:
      tags: [Accounting]
      operationId: createLoan
      summary: Record a new loan (money received from a lender)
      description: |
        Permission: `accounting.post` (superadmin, admin).

        Posts the disbursement. Loan principal is a liability, never revenue.

        Returns 400 if `lenderPartnerId` isn't an active lender, or if `maturityDate` is before `startDate`. If any step after the loan row is created fails, the partly created loan is rolled back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, lenderPartnerId, liabilityAccountId, principalAmount, startDate]
              properties:
                reference: { type: string }
                lenderPartnerId: { $ref: "#/components/schemas/Id" }
                liabilityAccountId: { $ref: "#/components/schemas/Id" }
                principalAmount: { $ref: "#/components/schemas/Money" }
                interestRatePct: { type: [number, "null"] }
                startDate: { $ref: "#/components/schemas/IsoDate" }
                maturityDate: { type: [string, "null"], format: date }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/loans/{id}/repayment:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Accounting]
      operationId: recordLoanRepayment
      summary: Record a loan repayment (principal and/or interest)
      description: |
        Permission: `accounting.post` (superadmin, admin).

        Missing amounts count as 0. Interest is entered manually here — there's no automatic accrual.

        Returns 400 if `paymentDate` is before the loan's start date. Repaying the full outstanding principal marks the loan `settled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentDate]
              properties:
                principalAmount: { type: integer, minimum: 0, default: 0 }
                interestAmount: { type: integer, minimum: 0, default: 0 }
                paymentDate: { $ref: "#/components/schemas/IsoDate" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/fiscal-periods:
    get:
      tags: [Accounting]
      operationId: listFiscalPeriods
      summary: List fiscal periods and whether they're open or closed
      description: "Permission: `accounting.reports.read` (all roles). A month with no row is open."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items:
                      type: object
                      required: [id, period, status]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
                        period: { type: string, example: "2026-08-01" }
                        status: { type: string, enum: [open, closed] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounting/fiscal-periods/{period}:
    parameters:
      - name: period
        in: path
        required: true
        description: Month start, YYYY-MM-01
        schema: { type: string, example: "2026-08-01" }
    put:
      tags: [Accounting]
      operationId: setFiscalPeriodStatus
      summary: Open or close a month for posting
      description: "Permission: `coa.manage` (superadmin, admin). Nothing can be posted into a closed month."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, closed] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `token` from `POST /api/auth/login`

  schemas:
    Error:
      type: object
      description: Every error response has this shape.
      required: [error]
      properties:
        error: { type: string, example: "You don't have permission to do this" }
    Role:
      type: string
      enum: [superadmin, admin, director, member]
    AuthUser:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Money:
      type: integer
      description: Integer Rupiah, no decimals
      example: 15000000
    IsoDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: "2026-09-24"
    Id:
      type: string
      format: uuid

    HealthStatus:
      type: string
      enum: [good, watch, action]
      description: "good = 🟢, watch = 🟡, action = 🔴"
    InvoiceStatus:
      type: object
      description: Derived from payment facts — never stored.
      required: [kind, label, daysOverdue]
      properties:
        kind:
          type: string
          enum: [draft, cancelled, void, paid, overdue, partially-paid, awaiting]
        label: { type: string, example: "Overdue 12 days" }
        daysOverdue: { type: integer }
    HeadlineStat:
      type: object
      required: [id, label, value, status, note]
      properties:
        id: { type: string, enum: [cash, revenue, profit] }
        label: { type: string, example: Cash on hand }
        value: { $ref: "#/components/schemas/Money" }
        status: { $ref: "#/components/schemas/HealthStatus" }
        note: { type: string, example: "Enough to run the company for about 8 months at current spending." }
        delta:
          type: object
          description: Omitted when there is nothing to compare against.
          required: [text, direction, upIsGood]
          properties:
            text: { type: string, example: "+ Rp 400 jt vs last month" }
            direction: { type: string, enum: [up, down] }
            upIsGood: { type: boolean }
    AttentionItem:
      type: object
      required: [id, severity, message, suggestedAction]
      properties:
        id: { type: string, example: overdue-Bapenda }
        severity: { type: string, enum: [critical, warning] }
        message: { type: string }
        suggestedAction: { type: string }
    ProjectStats:
      type: object
      required: [active, nearBilling, overBudget, pipelineValue, flaggedProject]
      properties:
        active: { type: integer }
        nearBilling: { type: integer }
        overBudget: { type: integer }
        pipelineValue:
          $ref: "#/components/schemas/Money"
        flaggedProject: { type: string, description: "First over-budget project's name, or empty string" }
    Dashboard:
      type: object
      required: [asOf, period, headlineStats, attentionItems, totalUnpaid, unpaidInvoices, projectStats]
      properties:
        asOf: { type: string, description: Human-readable reference date }
        period: { type: string, description: Human-readable current month }
        headlineStats:
          type: array
          items: { $ref: "#/components/schemas/HeadlineStat" }
        attentionItems:
          type: array
          items: { $ref: "#/components/schemas/AttentionItem" }
        totalUnpaid: { $ref: "#/components/schemas/Money" }
        unpaidInvoices:
          type: array
          items:
            type: object
            required: [id, number, client, project, amount, outstanding, dueDate, status]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              number: { type: string }
              client: { type: string }
              project: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
              outstanding: { $ref: "#/components/schemas/Money" }
              dueDate: { $ref: "#/components/schemas/IsoDate" }
              status: { $ref: "#/components/schemas/InvoiceStatus" }
        projectStats: { $ref: "#/components/schemas/ProjectStats" }

    DocumentStatus:
      type: string
      enum: [draft, posted, cancelled]
      description: Document lifecycle. Voiding a posted document is tracked separately (`voidedAt`).
    IdResult:
      type: object
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/Id" }
    InvoiceListItem:
      type: object
      required: [id, number, client, project, amount, amountPaid, outstanding, issuedDate, dueDate, status, documentStatus]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        number: { type: string }
        client: { type: string }
        project: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        amountPaid: { $ref: "#/components/schemas/Money" }
        outstanding: { $ref: "#/components/schemas/Money" }
        issuedDate: { $ref: "#/components/schemas/IsoDate" }
        dueDate: { $ref: "#/components/schemas/IsoDate" }
        paidDate:
          allOf: [{ $ref: "#/components/schemas/IsoDate" }]
          description: Omitted until fully paid
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        documentStatus: { $ref: "#/components/schemas/DocumentStatus" }
    InvoiceDocument:
      type: object
      required: [id, invoiceNumber, amount, amountPaid, issuedDate, dueDate, paidDate, voidedAt, status, postedAt, projectId, projectName, clientName]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        invoiceNumber: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        amountPaid: { $ref: "#/components/schemas/Money" }
        issuedDate: { $ref: "#/components/schemas/IsoDate" }
        dueDate: { $ref: "#/components/schemas/IsoDate" }
        paidDate: { type: [string, "null"], format: date }
        voidedAt: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        postedAt: { type: [string, "null"], format: date-time }
        projectId: { $ref: "#/components/schemas/Id" }
        projectName: { type: string }
        clientName: { type: string }

    UserListItem:
      type: object
      required: [id, name, email, role, isActive]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
    ExpenseCategory:
      type: string
      enum: [payroll, operations, project_costs]
    ClientType:
      type: string
      enum: [government, private]
    ProductLine:
      type: string
      enum: [VIANA, ORION, AIoT, Indi AI, 3D Digital Twin]
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer, description: Total matching rows across all pages }
    ExpenseInput:
      type: object
      properties:
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        projectId: { type: [string, "null"], format: uuid, description: Required for project_costs only }
        description: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        spentOn: { $ref: "#/components/schemas/IsoDate" }
        partnerId: { type: [string, "null"], format: uuid, description: The vendor — required when dueDate is set }
        dueDate: { type: [string, "null"], format: date, description: Set it to make this a vendor bill (paid later) }
        paidFromAccountId: { type: [string, "null"], format: uuid, description: Bank/cash account that paid — cash expenses only }
    ExpenseDocument:
      type: object
      required: [id, documentNumber, category, status, description, amount, spentOn, dueDate, voidedAt, partnerId, partnerName, projectId, projectName, paidFromAccountId, paidFromAccountName]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        documentNumber: { type: [string, "null"], description: Assigned when posted }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        description: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        spentOn: { $ref: "#/components/schemas/IsoDate" }
        dueDate: { type: [string, "null"], format: date }
        voidedAt: { type: [string, "null"], format: date-time }
        partnerId: { type: [string, "null"], format: uuid }
        partnerName: { type: [string, "null"] }
        projectId: { type: [string, "null"], format: uuid }
        projectName: { type: [string, "null"] }
        paidFromAccountId: { type: [string, "null"], format: uuid }
        paidFromAccountName: { type: [string, "null"] }
    AttachmentEntityType:
      type: string
      enum: [expense, invoice, journal_entry]
    AttachmentMimeType:
      type: string
      enum: [application/pdf, image/png, image/jpeg, image/webp]
    Project:
      type: object
      required: [id, name, client, productLine, contractValue, billedToDate, isFlagged, health]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        client: { type: string }
        productLine: { $ref: "#/components/schemas/ProductLine" }
        contractValue: { $ref: "#/components/schemas/Money" }
        billedToDate: { $ref: "#/components/schemas/Money" }
        budget:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Omitted if the project has no budget
        spent:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Omitted if the project has no budget
        isFlagged: { type: boolean }
        health:
          type: object
          required: [kind, label, progressPct]
          properties:
            kind: { type: string, enum: [over-budget, near-billing, on-schedule] }
            label: { type: string, example: Close to billing }
            progressPct: { type: integer, description: "Billed ÷ contract value, %" }
    Partner:
      type: object
      required: [id, name, clientType, isCustomer, isVendor, isEmployee, isLender, isActive, taxId]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        clientType: { oneOf: [{ $ref: "#/components/schemas/ClientType" }, { type: "null" }] }
        isCustomer: { type: boolean }
        isVendor: { type: boolean }
        isEmployee: { type: boolean }
        isLender: { type: boolean }
        isActive: { type: boolean }
        taxId: { type: [string, "null"] }

    BudgetItem:
      type: object
      required: [id, name, budget, spent, health]
      properties:
        id: { type: string, example: cat-payroll }
        name: { type: string }
        subtitle: { type: string, description: Client name (project items only) }
        budget: { type: [integer, "null"], description: null when no plan applies in this scope }
        spent: { $ref: "#/components/schemas/Money" }
        health:
          oneOf:
            - type: "null"
            - type: object
              required: [kind, label, pctUsed, remaining]
              properties:
                kind: { type: string, enum: [on-track, near-limit, over] }
                label: { type: string, example: Close to the limit }
                pctUsed: { type: integer, description: Can exceed 100 }
                remaining: { type: integer, description: Negative when over budget }

    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]
    AccountSubtype:
      type: string
      enum: [bank, cash, receivable, prepaid, other_current_asset, fixed_asset, payable, tax_payable, payroll_payable, loan, other_current_liability, capital, retained_earnings, opening_balance, operating_revenue, other_revenue, project_cost, payroll_expense, operating_expense, financial_expense]
    Account:
      type: object
      required: [id, code, name, type, subtype, parentId, isPostable, isActive]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        code: { type: string, example: "111100" }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        subtype: { $ref: "#/components/schemas/AccountSubtype" }
        parentId: { type: [string, "null"], format: uuid }
        isPostable: { type: boolean }
        isActive: { type: boolean }
    TrialBalanceRow:
      type: object
      required: [accountId, accountCode, accountName, accountType, accountSubtype, debit, credit, balance]
      properties:
        accountId: { $ref: "#/components/schemas/Id" }
        accountCode: { type: string }
        accountName: { type: string }
        accountType: { $ref: "#/components/schemas/AccountType" }
        accountSubtype: { $ref: "#/components/schemas/AccountSubtype" }
        debit: { type: integer }
        credit: { type: integer }
        balance: { type: integer, description: debit − credit }
    FinancialSummary:
      type: object
      required: [asOf, assets, liabilities, equity, revenue, expenses, netIncome, cash, receivables, payables]
      properties:
        asOf: { type: [string, "null"] }
        assets: { type: integer }
        liabilities: { type: integer }
        equity: { type: integer }
        revenue: { type: integer }
        expenses: { type: integer }
        netIncome: { type: integer }
        cash: { type: integer }
        receivables: { type: integer, description: Money clients owe us }
        payables: { type: integer, description: Money we owe vendors }
    GeneralLedgerLine:
      type: object
      required: [lineId, journalEntryId, entryNumber, journalCode, accountingDate, accountCode, accountName, description, debit, credit, partnerId, projectId, sourceType, sourceId]
      properties:
        lineId: { $ref: "#/components/schemas/Id" }
        journalEntryId: { $ref: "#/components/schemas/Id" }
        entryNumber: { type: string }
        journalCode: { type: string }
        accountingDate: { $ref: "#/components/schemas/IsoDate" }
        accountCode: { type: string }
        accountName: { type: string }
        description: { type: [string, "null"] }
        debit: { type: integer }
        credit: { type: integer }
        partnerId: { type: [string, "null"], format: uuid }
        projectId: { type: [string, "null"], format: uuid }
        sourceType: { type: string, description: "What created it, e.g. invoice, expense, manual" }
        sourceId: { type: [string, "null"], format: uuid }
    JournalEntryRow:
      type: object
      required: [id, entryNumber, accountingDate, journalCode, journalName, description, reference, sourceType, status, amount]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        entryNumber: { type: string }
        accountingDate: { $ref: "#/components/schemas/IsoDate" }
        journalCode: { type: string }
        journalName: { type: string }
        description: { type: string }
        reference: { type: [string, "null"] }
        sourceType: { type: string }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        amount: { type: integer, description: Total debits }
    JournalEntryDetail:
      type: object
      required: [id, entryNumber, journalId, journalCode, journalName, accountingDate, reference, description, status, sourceType, sourceId, reversalOfId, lines]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        entryNumber: { type: string }
        journalId: { $ref: "#/components/schemas/Id" }
        journalCode: { type: string }
        journalName: { type: string }
        accountingDate: { $ref: "#/components/schemas/IsoDate" }
        reference: { type: [string, "null"] }
        description: { type: string }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        sourceType: { type: string }
        sourceId: { type: [string, "null"], format: uuid }
        reversalOfId: { type: [string, "null"], format: uuid, description: Set if this entry reverses another }
        lines:
          type: array
          items:
            type: object
            required: [id, lineNo, accountId, accountCode, accountName, partnerId, partnerName, projectId, projectName, description, debit, credit]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              lineNo: { type: integer }
              accountId: { $ref: "#/components/schemas/Id" }
              accountCode: { type: string }
              accountName: { type: string }
              partnerId: { type: [string, "null"], format: uuid }
              partnerName: { type: [string, "null"] }
              projectId: { type: [string, "null"], format: uuid }
              projectName: { type: [string, "null"] }
              description: { type: [string, "null"] }
              debit: { type: integer }
              credit: { type: integer }
    ManualEntryLine:
      type: object
      required: [accountCode, debit, credit]
      description: Exactly one of debit/credit must be > 0.
      properties:
        accountCode: { type: string, description: Account code (not id) }
        partnerId: { type: [string, "null"], format: uuid }
        projectId: { type: [string, "null"], format: uuid }
        description: { type: [string, "null"] }
        debit: { type: integer, minimum: 0 }
        credit: { type: integer, minimum: 0 }
    PostedEntry:
      type: object
      required: [id, entryNumber]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        entryNumber: { type: string }
    ProjectProfitabilityRow:
      type: object
      required: [projectId, projectName, clientName, revenue, cost, profit, marginPct]
      properties:
        projectId: { $ref: "#/components/schemas/Id" }
        projectName: { type: string }
        clientName: { type: string }
        revenue: { type: integer }
        cost: { type: integer }
        profit: { type: integer }
        marginPct: { type: [number, "null"], description: null when revenue is 0 }
    AgingResult:
      type: object
      required: [asOf, buckets, partners]
      properties:
        asOf: { $ref: "#/components/schemas/IsoDate" }
        buckets:
          type: array
          items:
            type: object
            required: [label, amount]
            properties:
              label: { type: string, enum: [current, 1-30, 31-60, 61-90, 90+], description: Days past due }
              amount: { type: integer }
        partners:
          type: array
          description: Largest total first
          items:
            type: object
            required: [partnerId, partnerName, total, current, d1_30, d31_60, d61_90, d90plus]
            properties:
              partnerId: { $ref: "#/components/schemas/Id" }
              partnerName: { type: string }
              total: { type: integer }
              current: { type: integer }
              d1_30: { type: integer }
              d31_60: { type: integer }
              d61_90: { type: integer }
              d90plus: { type: integer }
    LoanStatus:
      type: string
      enum: [active, settled, cancelled]
    DebtOutstandingRow:
      type: object
      required: [loanId, reference, lenderName, principalAmount, outstandingPrincipal, interestPaid, status, maturityDate]
      properties:
        loanId: { $ref: "#/components/schemas/Id" }
        reference: { type: string }
        lenderName: { type: string }
        principalAmount: { type: integer }
        outstandingPrincipal: { type: integer }
        interestPaid: { type: integer }
        status: { $ref: "#/components/schemas/LoanStatus" }
        maturityDate: { type: [string, "null"], format: date }
    IncomeStatement:
      type: object
      required: [from, to, revenue, expenses, totalRevenue, totalExpenses, netIncome]
      properties:
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }
        revenue:
          type: array
          items: { $ref: "#/components/schemas/IncomeStatementLine" }
        expenses:
          type: array
          items: { $ref: "#/components/schemas/IncomeStatementLine" }
        totalRevenue: { type: integer }
        totalExpenses: { type: integer }
        netIncome: { type: integer }
    IncomeStatementLine:
      type: object
      required: [accountCode, accountName, amount]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        amount: { type: integer }
    CashFlow:
      type: object
      required: [from, to, granularity, openingCash, closingCash, totalInflow, totalOutflow, netMovement, buckets]
      properties:
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }
        granularity: { type: string, enum: [day, week, month] }
        openingCash: { type: integer }
        closingCash: { type: integer }
        totalInflow: { type: integer }
        totalOutflow: { type: integer }
        netMovement: { type: integer }
        buckets:
          type: array
          items:
            type: object
            required: [periodStart, inflow, outflow, net, closing]
            properties:
              periodStart: { $ref: "#/components/schemas/IsoDate" }
              inflow: { type: integer }
              outflow: { type: integer }
              net: { type: integer }
              closing: { type: integer, description: Cash balance at the end of this bucket }

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, const: true }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Your role lacks the required permission, or the account is deactivated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No record with that id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not allowed in the record's current state (e.g. editing a posted document)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
